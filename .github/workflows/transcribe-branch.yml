name: Transcribe (tijdelijk)
on:
  push:
    branches: ["transcribe/**"]
permissions:
  contents: write
jobs:
  t:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[transcript]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper
          python - <<'PY'
          import sys, json
          sys.path.insert(0, '.')
          import pipeline as P
          ffmpeg = __import__('subprocess').run
          ffmpeg(['ffmpeg','-v','error','-y','-i','tmp/audio.ogg','-ac','1','-ar','16000','tmp/a.wav'], check=True)
          g = open('woordenlijst.txt').read().replace('\n', ',') + 'steenwol,glaswol,isolatiewaarde'
          segs = P.transcribe_faster_whisper('tmp/a.wav', lambda f, m: None, model_size='medium', glossary=g)
          json.dump({'segments': segs}, open('tmp/transcript.json', 'w'), ensure_ascii=False)
          PY
          git config user.name reels-bot; git config user.email reels-bot@users.noreply.github.com
          git add tmp/transcript.json && git commit -qm "[transcript]" && git push -q
